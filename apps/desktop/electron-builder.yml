appId: br.com.sektor.app
productName: Sektor
directories:
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
mac:
  target: dir
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: O Sektor usa o microfone para você falar com o assistente. O áudio é transcrito no seu computador.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
